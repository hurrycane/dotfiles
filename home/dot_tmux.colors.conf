# This tmux statusbar config was created by tmuxline.vim
# on Sun, 21 May 2017
#
# Ported to tmux 2.9+ syntax: the separate -fg/-bg/-attr options it originally
# emitted were merged upstream into single -style options, and tmux now rejects
# the old names outright. Every colour below is unchanged from the original.
# status-fg and window-status-current-style were never set and still are not --
# the format strings further down colour those inline.

set -g status "on"
set -g status-justify "left"
set -g status-style "bg=colour236,none"
set -g status-left-length "100"
set -g status-left-style none
set -g status-right-length "100"
set -g status-right-style none

set -g message-style "fg=colour231,bg=colour240"
set -g message-command-style "fg=colour231,bg=colour240"

set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour148"

setw -g window-status-style "fg=colour245,bg=colour236,none"
setw -g window-status-activity-style "fg=colour148,bg=colour236,none"
setw -g window-status-separator ""

set -g status-left "#[fg=colour22,bg=colour148,bold] [#S] #[fg=colour148,bg=colour236,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=colour252,bg=colour236,nobold,nounderscore,noitalics]#[fg=colour241,bg=colour252] \"#22T\" %H:%M %d-%b-%y "
setw -g window-status-format "#[fg=colour236,bg=colour236,nobold,nounderscore,noitalics]#[default] #I:#W#F #[fg=colour236,bg=colour236,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=colour236,bg=colour240,nobold,nounderscore,noitalics]#[fg=colour231,bg=colour240] #I:#W#F #[fg=colour240,bg=colour236,nobold,nounderscore,noitalics]"
